<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AXIOM — Mockups</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
<style>
  body {
    font-family: 'Nunito', system-ui, sans-serif;
    margin: 0;
    min-height: 100vh;
    color: #1a1535;
    background: radial-gradient(120% 120% at 20% 0%, #efe9ff 0%, #f5f1fb 40%, #fdeffa 100%);
    padding: 40px 24px;
  }
  .wrap { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 28px; font-weight: 900; margin: 0 0 4px; }
  p.sub { color: #6b6781; margin: 0 0 28px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
  a.card {
    display: block;
    text-decoration: none;
    color: inherit;
    background: rgba(255,255,255,0.6);
    border: 1px solid rgba(120,80,220,0.18);
    border-radius: 16px;
    padding: 18px;
    box-shadow: 0 4px 20px rgba(60,20,120,0.1);
    transition: transform 0.12s, box-shadow 0.12s;
  }
  a.card:hover { transform: translateY(-2px); box-shadow: 0 8px 26px rgba(60,20,120,0.16); }
  a.card.current { border-color: #6c5ce7; border-width: 2px; }
  .tag { display: inline-block; font-size: 11px; font-weight: 800; color: #6c5ce7; background: rgba(108,92,231,0.12); padding: 2px 8px; border-radius: 999px; margin-bottom: 8px; }
  .name { font-weight: 800; font-size: 16px; }
  .desc { color: #6b6781; font-size: 13px; margin-top: 4px; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>AXIOM mockups</h1>
    <p class="sub">UX reference screens. The marked ones are current.</p>
    <div class="grid">
      <a class="card current" href="today-v5.html">
        <span class="tag">CURRENT</span>
        <div class="name">Today v5</div>
        <div class="desc">Cockpit with the 3 differentiating features</div>
      </a>
      <a class="card current" href="month.html">
        <span class="tag">CURRENT</span>
        <div class="name">Calendar / Month</div>
        <div class="desc">Multi-GCal sync + allocation bars</div>
      </a>
      <a class="card current" href="team.html">
        <span class="tag">CURRENT</span>
        <div class="name">Team</div>
        <div class="desc">Delegation tracker</div>
      </a>
      <a class="card" href="today-v4.html">
        <div class="name">Today v4</div>
        <div class="desc">Gmail-style wallpaper picker</div>
      </a>
    </div>
  </div>
</body>
</html>
