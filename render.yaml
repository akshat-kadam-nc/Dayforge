# Render Blueprint — single-origin deploy of Dayforge (API + built client on one
# free Web Service). Create the service via Render dashboard → New → Blueprint,
# or set the same fields manually. Secrets marked sync:false are filled in the
# dashboard (never commit them).
services:
  - type: web
    name: dayforge
    runtime: node
    plan: free
    # Free web services sleep after ~15 min idle and cold-start on next request.
    region: oregon
    # npm ci wipes node_modules and installs exactly from the lockfile.
    # --include=dev keeps devDeps despite NODE_ENV=production. The ls lines are
    # temporary diagnostics: they print where @types/node actually landed so a
    # TS2688 ("cannot find type node") can be traced on Render's box.
    buildCommand: >-
      npm ci --include=dev &&
      echo "--- @types at root ---" && ls node_modules/@types 2>&1 | tr '\n' ' ' &&
      echo "" && echo "--- @types in server ---" && ls server/node_modules/@types 2>&1 | tr '\n' ' ' &&
      echo "" && npm run build
    startCommand: npm start --workspace server
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVE_CLIENT
        value: "true"
      - key: NODE_VERSION
        value: "22"
      # Signed once by Render and kept stable across deploys.
      - key: JWT_SECRET
        generateValue: true
      # Served on a custom subdomain (added in Settings → Custom Domains).
      - key: CLIENT_ORIGIN
        value: https://dayforge.akshatkadam.com
      - key: GOOGLE_REDIRECT_URI
        value: https://dayforge.akshatkadam.com/api/google/callback
      # Secrets — fill in the dashboard, never committed:
      - key: MONGODB_URI
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
